<div class="translating-state" role="status" aria-live="polite" aria-atomic="true">
  <svg class="translation-document-icon"{% if icon_id %} id="{{ icon_id }}"{% endif %} viewBox="0 0 96 96" aria-hidden="true" focusable="false"><path class="translation-page" d="M25 12h31l15 15v51a6 6 0 0 1-6 6H25a6 6 0 0 1-6-6V18a6 6 0 0 1 6-6Z"/><path class="translation-fold" d="M56 12v15h15"/><path class="translation-language-line" d="M31 49h31"/><path class="translation-language-line line-two" d="M31 62h24"/></svg>
  <strong{% if state_word_id %} id="{{ state_word_id }}"{% endif %}>Translating</strong>
  <span{% if state_description_id %} id="{{ state_description_id }}"{% endif %} class="sr-only">{{ loading_description|default:"Translation is in progress." }}</span>
  {% if progress_id %}
    <div{% if progress_wrap_id %} id="{{ progress_wrap_id }}"{% endif %} class="translation-progress-wrap">
      <div id="{{ progress_id }}" class="translation-loading-progress" role="progressbar" aria-label="Translation is in progress" aria-describedby="{{ state_description_id }}" aria-valuetext="Translation in progress"><span></span></div>
    </div>
  {% endif %}
</div>
